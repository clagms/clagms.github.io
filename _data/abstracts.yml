Sartaj2026: |
  Self-adaptive robotic systems operate autonomously in dynamic and uncertain environments, requiring robust real-time monitoring and adaptive behaviour. Unlike traditional robotic software with predefined logic, self-adaptive robots leverage artificial intelligence (AI), machine learning and model-driven engineering to adapt to changing conditions continuously, ensuring reliability, safety and optimal performance. This article presents a research agenda for software engineering in self-adaptive robotics, structured along two dimensions. The first concerns the software engineering lifecycle—requirements, design, development, testing and operations—tailored to the challenges of self-adaptive robotics. The second focuses on enabling technologies, i.e., digital twins and AI-driven adaptation, which support runtime monitoring, fault detection and automated decision-making. We identify open challenges, including verifying adaptive behaviours under uncertainty, balancing tradeoffs among adaptability, performance and safety, and integrating self-adaptation frameworks such as MAPE-K/MAPLE-K. By consolidating these challenges into a roadmap toward 2030, this work contributes to the foundations of trustworthy and efficient self-adaptive robotic systems capable of meeting the complexities of real-world deployment.

Evans2027: |
  We introduce source coding as a method for compressing intermediate Signal Temporal Logic (STL) verdicts in a distributed system with a centralized monitor. Additionally, we introduce stateful and event-triggered source coding to further enhance compression. We theoretically analyze the effects of allocation and aggregation of properties on compressibility, and establish conditions where aggregation guarantees better compression. Furthermore, we outline an algorithm exploiting logical associativity laws and property re-arrangement to increase aggregation and potentially compression. We test our approaches on industry-related STL specifications and investigate the effects of aggregation and number of allocated properties under our proposed schemes. We demonstrate that we can achieve compression ratios up to 5.96 × 10³ and 32.4 compared to raw signals and uncompressed atomic verdicts, respectively.

Gomes2026: |
  Digital twins (DTs) increasingly combine models, simulators, estimators, optimizers, and knowledge-management services to monitor and steer adaptive cyber-physical systems. Yet most DTs are still engineered as custom assemblies whose interfaces capture data exchange but not the assumptions and guarantees needed for safe reuse. This vision paper argues that DT engineering should move toward contract-aware interfaces: explicit contracts that state not only what data a component exchanges, but also the validity, timing, fidelity, robustness, and uncertainty assumptions governing its trustworthy use. We position BRIC-DT as a contract layer for recurring DT services, outline the gap between current interoperability mechanisms and correctness-preserving composition, and set out a research agenda around explicit correctness properties, reusable composition operators, and correctness-preserving evolution.

Fitzgerald2026: |
  Digital twins couple computational models with physical systems to enable services such as predictive reasoning and runtime analysis that support decision–making for maintenance, optimisation and system evolution. They create a technically rich setting for applying formal methods throughout the system lifecycle beyond design-time. This tutorial introduces the elements of digital twin technology, identifying emerging opportunities for formal techniques, including the verification of evolving models under uncertainty, integration of heterogeneous models and rigorous composition of digital twin-enabled systems.

Andersen2026: |
  Digital Twins (DTs) must be updated and kept secure throughout their life cycle to remain consistent with their physical twins. Prior work proposed Semi-Markov Processes (SMPs) for probabilistic update scheduling, where updates are initiated when the system is likely to be in an update-suitable state. However, creating representative SMPs is a difficult, manual, and time-consuming process that requires domain expertise and knowledge of stochastic modeling techniques. This paper presents SMP Workbench, a tool for generating, visualizing, and refining SMP models for DTs. The tool derives an initial SMP from event logs, presents the resulting model in an editable visual form, and allows domain experts to inspect and refine the states, transitions, transition probabilities, and holding-time distributions before the model is used for stochastic analysis. We demonstrate the tool on logs from a case study and show how it supports a workflow from operational logs to creation of SMP models.

Kristensen2027: |
  As software systems adapt, receive updates, or acquire new requirements, their runtime monitors must often evolve as well. However, many stream-based runtime verification approaches require monitors to be restarted when their specifications change, causing internal monitor state and historical input data to be lost. To address this limitation, we present DSRV, a stream-based runtime verification language that supports dynamic monitor reconfiguration at runtime while preserving relevant monitor state across specification changes. We evaluate DSRV using a distributed leader-election case study featuring changing monitor roles and simulated failure scenarios. The results show that DSRV can update monitors without restarting them or losing historical context, while introducing minimal runtime overhead.

Wang2026: |
  Digital twins enable monitoring, control, optimization, and predictive maintenance in buildings, but they require fast simulations to operate in (near) real-time during building operation. Surrogate models address this computational challenge, yet training them demands large datasets. Current approaches face a fundamental bottleneck: operational data only becomes available after commissioning, while existing BIM2SIM workflows remain manual, error-prone, and cannot scale to generate the necessary amount of synthetic training data. To this end, we present a model-driven pipeline that automates the BIM2SIM workflow. Our method transforms Building Information Models (BIM) into executable simulation models (SIM) that generate synthetic training data at scale for surrogate modeling. We validate our approach using a Living Lab at the University of Innsbruck. Results show that our generated simulation models match measured building behavior, the code generation scales with model complexity, and the synthetic data is sufficient for training reliable surrogate models.

Thrue2026: |
  This paper presents the design of a digital twin of DC/DC step-down power converters in practical Power-to-Hydrogen applications. The motivation of the work arises from the increasing relevance of step-down DC/DC conversion in Power to Hydrogen (PtH) systems, where the DC-link voltage obtained after rectification is often higher than the voltage level required by the electrolyzer stack, while low ripple and stable DC operation remain important for efficient and reliable operation. In this regard, the DC/DC buck converter is selected as a first and physically interpretable case study, since it captures the fundamental dynamics of step-down conversion and provides a suitable basis for later extension toward more advanced converter structures. The paper presents the converter structure, the main steady-state and dynamic relations and the development of a digital twin model. In addition, an experimental converter prototype is designed and built in order to compare the behavior of the digital twin model and the physical setup. The comparison indicates that the developed model is able to reproduce the main converter behavior with reasonable agreement, while also showing that parasitic elements and practical nonidealities have a clear influence on the compliance between the digital and physical systems. Based on the presented analysis, the paper further discusses how such a digital twin can provide a structured framework for future online monitoring, parameter adaptation, communication-assisted implementation and possible fault-oriented analysis in PtH power electronic systems.

Wright2026: |
  This paper introduces a framework for self-adaptive distributed runtime monitoring of autonomous systems, where centralised monitoring is often impractical due to communication overhead, latency, and data privacy concerns. We extend stream-based runtime verification with distribution constraints, which specify how monitoring should be distributed across a network, and are continually verified as the system runs. To maintain valid monitor placements under changing conditions (such as node mobility, failures, or topology changes), we introduce a MAPE-K-based scheduler that detects distribution constraint violations and triggers monitor reconfiguration. We evaluate the approach in a ROS 2/Gazebo multi-robot patrolling scenario with four robots and machine-monitoring tasks.

Gil2026: |
  Given recent technological trends, such as the use of Digital Twins, modeling and simulation have become essential in both the design and the operation of robotic systems. However, developing large simulations that feature several aspects of a robotic system is not trivial. Co-simulation can be used to address this challenge by the hierarchical aggregation of heterogeneous simulators. The recent industry standard Functional Mock-up Interface version 3 (FMI3) adopts the concept of super-dense time to enable both continuous-time and discrete-event simulation. In this work, we extend an existing framework for robotics that supports the creation of modular co-simulation scenarios with simulated or real robots in the loop by upgrading its artifacts to support hybrid co-simulation with FMI3. With these upgraded artifacts, the extended framework accounts for both continuous-time and discrete-event simulations, providing a more comprehensive coverage of scenarios and behaviors of robotic systems. We use a UR5e robotic arm for the demonstration of the FMI3-enabled framework and provide our findings and recommendations from the experiments executed.

Biglari2026: |
  Validity Frames are a key concept in modelling and simulation, encoding the contexts in which models provide valid results. This position paper explores how Validity Frames propagate through optimisation processes and affect self-adaptive systems. We demonstrate that optimisers inherit constraints from model Validity Frames and generate their own validity conditions for the configurations they produce. These propagated Validity Frames can be formalised as software contracts with explicit assumptions and guarantees. Using a semi-active suspension system as a running example, we show how Validity Frames constrain design space exploration, enable runtime monitoring of validity boundaries, and support informed adaptation strategies. Our approach reveals a fundamental tradeoff between optimality and applicability: configurations optimised for narrow scenarios may achieve peak performance but fail when conditions change, while configurations evaluated across broader Validity Frames sacrifice peak performance for robustness. By explicitly tracking Validity Frames throughout the optimisation process, self-adaptive systems can reason about when adaptation is needed and select configurations appropriate to their current operational context. The full formalisation of validity frames into contracts and their composition, which allows for the precise integration of assumptions and guarantees across models, optimisers, and adaptive components, will be our main future work path.

Kristensen2026: |
  Systems that adapt to their environment or change based on new requirements pose challenges for runtime verification. Complexity is increased when the system needs to retain its internal state and continue monitoring while also updating properties or adding new ones during runtime. In this work, we propose DynSRV, a Stream Runtime Verification language that allows for dynamic updates of properties. A core benefit of this language is its capability to update properties at runtime without requiring a restart of the monitor, maintaining the internal state of the remaining properties. We formalise the semantics of our core primitives and demonstrate design patterns for allowing adaptations under certain constraints. Finally, we present an implementation of DynSRV and describe three memory strategies that balance memory usage and the ability to resolve dynamically added properties depending on historical data.

Isasa2026: |
  This paper presents a case study in the design and formal verification of a safe controller for the generic two-element lumped-capacitance model of temperature regulation, using formal cyber-physical system (CPS) theorem proving. The coupled dynamics and the absence of a fallback state reflect the complexities of real-world control systems and make it a representative challenge for theorem proving. A controller is developed by a design-by-invariant methodology. Verification using the axiomatic theorem prover KeYmaera X revealed critical assumptions for safety and pushes the frontier of CPS theorem proving. The parametric, general and provably safe controller can be applied to a wide range of temperature regulation tasks and is validated by deploying an instance of the verified controller on a physical system, demonstrating its robustness under model inaccuracies and confirming its real-world usability.

Frasheri2026: |
  Digital Twin (DT) technologies are envisioned to bring substantial benefits to industry by optimising production processes, thus reducing the costs and time-to-market of products. A DT is a digital representation of a real-world entity which we call the Physical Twin (PT). The DT and PT are connected by a communications infrastructure which allows the DT to maintain a known level of fidelity to the PT it represents. A DT leverages the models at its core to offer its stakeholders a range of services that add value to the PT without unduly compromising the PT’s operation. These services could include visualisation and monitoring, predictive maintenance, fault diagnosis, what-if analysis and runtime reconfiguration of the PT. The key concepts behind DTs, as well as ways to obtain services from them in industrial settings, coupled with reports on existing case-studies, are the main topics covered in this Chapter.

Andersen2025: |
  Digital Twins (DTs) often require maintenance throughout their life cycles, as their Physical Twin (PT) counterparts undergo maintenance and evolution. This necessitates software updates to the DT, but when should these updates be done? Updating the DT at the wrong time can lead to inconsistencies between the DT and PT, as well as failures and increased downtime. This study investigates the practicality and usability of applying Semi-Markov Processes (SMPs) to represent the connections and state transitions of the DT-enabled system. SMPs can be used to calculate the probability that all components in the system are collectively in a safe state, that is, in a state where updating the DT would result in minimal disruption to the DT-enabled system’s operation. We also discuss the limitations of the approach and the future work required to make it robust. Lastly, we present how SMPs can be used for an industrial concrete mixer as our case study, to remove the need for fixed maintenance intervals, which are costly.

Evans2025: |
  We propose a novel event-trigger threshold (ETT) regulation mechanism ETT^ρ based on Signal Temporal Logic (STL) properties significantly extending recent work on ETT regulation for Propositional Logic properties. We utilize the quantitative semantics of STL to construct a method for computing and merging suitable ETTs for different requirements in complex STL specifications. Contrary to related work on event-triggered control for STL properties, we apply the event-triggering logic to the measured signals individually rather than the control output and assume that an existing periodic controller is defined. By exploiting the early satisfaction detection capabilities of STL and analyzing the property structure, our method aims to reduce the number of triggered events, while maintaining satisfaction of system properties. To evaluate ETT^ρ, we consider a simulated adaptive cruise control case-study where STL is used to encode complex safety and performance properties and the ETTs of measured signals are regulated accordingly. We test three different properties in two different scenarios to showcase how STL and ETT^ρ can identify intricate circumstances where it is possible to significantly reduce the number of triggered events relative to a constant ETT.

Biglari2025: |
  Multi-modal systems, such as urban traffic networks, require considering specific modeling considerations for varying operational and environmental conditions. Surrogate modeling offers a practical solution to represent these modes through different surrogate models. However, switching between modes needs careful management of the models’ experimental frames. In multi-model setups, overlap between these frames introduces unnecessary complexity and ambiguity in model selection. The concept of validity frame of multi-modal surrogate models is the model’s experimental frame plus the process allowing to change this frame. This paper introduces an approach to define such a validity frame ensuring that the union of all experimental frames covers the full system operating domain without redundancy and focusing on clean separation between models and interpretable mode switching. The proposed ensemble of surrogate models, coupled with adaptive techniques, represents a significant step forward in the performance modeling of dynamic and computationally expensive models.

Vanommeslaeghe2025: |
  Simulating cyber-physical systems (CPS) often requires integrating continuous dynamics, typically described by differential equations, with discrete-event dynamics that represent the behavior of embedded controllers. Version 3.0 of the Functional Mock-up Interface (FMI) standard introduces synchronous clocks and a discrete-event mode, creating new opportunities for the co-simulation of hybrid systems. So far, it has not been demonstrated that these features can faithfully capture the semantics of discrete-event formalisms such as the Discrete EVent System specification (DEVS) and its extension, Parallel DEVS (PDEVS). This leaves open the question of whether FMI 3.0 can effectively support complex hybrid dynamics. This paper addresses this gap by showing how PDEVS models can be exported and coupled as FMI 3.0 Functional Mock-up Units (FMUs) while preserving PDEVS semantics. We first derive requirements that any simulator must satisfy to correctly preserve PDEVS semantics. Based on these requirements, we present a systematic mapping of PDEVS abstract simulator functions to the FMI 3.0 interface with synchronous clocks and present an orchestration algorithm to co-simulate multiple PDEVS FMUs accordingly. The approach is validated using an adaptive cruise control case study, where our FMI-based co-simulation reproduces the results of an established PDEVS simulator. To support reproducibility and further research, we provide an open-source prototype together with the complete validation setup.

Baxter2025: |
  It is often the case that a robot must adapt to unexpected changes in its environment. It is, however, important that these changes can be demonstrated to maintain the safe operation of the robot. The adaptive systems community has developed the MAPE-K pattern as a widely recognised conceptual architecture. We propose extending MAPE-K to incorporate runtime verification, resulting in an architecture we call MAPLE-K. In this paper, we capture and formalise both the MAPE-K and MAPLE-K architectures using a domain-specific language. Additionally, we provide support for translation from architectural models to software models and code to facilitate the deployment of verified applications. MAPE-K is rarely maintained at the implementation level, but our work ensures traceability between the code and its design, enabling the use of architectural information to verify the correctness of the software.

Kakavandi2025: |
  Developing a data-driven fault detection model for an actual manufacturing process poses significant challenges, particularly during the design phase, when accessing a large volume of data is not feasible. One approach to address data scarcity is the generation of synthetic datasets to aid in the training process. This paper focuses on conducting a comparative study between deep generative models and a simulation model for generating synthetic samples. Various deep generative models such as Variational Autoencoder (VAE) are explored and applied in this study. Additionally, the Finite Element Analysis (FEA) technique is employed to develop the simulation model, leveraging physics-based approaches. Furthermore, the performance of these generative techniques is evaluated and compared using qualitative and quantitative evaluation methods. The results demonstrate that different methods exhibit varying levels of performance based on qualitative and quantitative criteria. Eventually, the impact of synthetic samples generated by different approaches on the fault detection model is evaluated and reported. Synthetic normal and anomalous samples are added to the training set, and the model is tested solely on real data. The results indicate that majority of generative techniques enhance the performance of the fault detection model, requiring fewer training iterations and improving the model’s predictive capabilities. Notably, synthetic data generated by VAE significantly improve the fault detection model’s F1 score when only synthetic normal samples added to the training set by 0.185 in our case.

Deantoni2025: |
  Uncertainty is an inherent property of any complex system, especially those that integrate physical parts or operate in real environments. In this paper, we focus on the Digital Twins of adaptive systems, which are particularly complex to design, verify, and optimize. One of the problems of having two systems (the physical one and its digital replica) is that their behavior may not always be consistent. In addition, both twins are normally subject to different types of uncertainties, which complicates their comparison. In this paper we propose the explicit representation and treatment of the uncertainty of both twins, and show how this enables a more accurate comparison of their behaviors. Furthermore, this allows us to reduce the overall system uncertainty and improve its behavior by properly averaging the individual uncertainties of the two twins. An exemplary incubator system is used to illustrate and validate our proposal.

Gomes2025: |
  This paper presents a comprehensive Digital Twin (DT) tutorial using the case study of an incubator system designed for tempeh fermentation (a traditional Indonesian soy product). The study explores the development, calibration, and validation of models based on thermodynamics, offering insight into how DTs can enhance control and monitoring. Key DT services such as monitoring, decision support, and reconfiguration are implemented and evaluated. The tutorial demonstrates the potential of DTs in optimizing real-time systems while ensuring operational consistency.

Gil2025: |
  Distributed co-simulation plays a key role in enabling collaborative modeling and simulation by different stakeholders while protecting their Intellectual Property (IP). Although IP protection is provided implicitly by co-simulation, there is no consensus in the guidelines to conduct distributed co-simulation of continuous-time or hybrid systems with no exposure to potential hacking attacks. We propose an approach for distributed co-simulation on top of UniFMU with enhanced cybersecurity and IP protection mechanisms, ensuring that the connection is initiated by the client and the models and binaries live on trusted platforms. We showcase the functionality of this approach using two co-simulation demos in four different network settings and analyze the trade-off between IP-protected distribution and performance efficiency in these settings.

Bas2024: |
  Testing of large wind turbine components plays a central role in delivering reliable yet cost-effective technology. However, these experiments are often lengthy and costly. Fatigue testing of a wind turbine blade might take up to 12-14 months, whereas highly accelerated lifetime testing of a nacelle demands 6-8 months. The exchange of simulation models and data between OEMs and test facilities is recognized as a critical factor in the planning of an experimental campaign. In fact, OEMs are typically very protective of their industrial secrets, and sharing such sensitive information may constitute a threat. It follows that the use of simulation models to enable more effective experimentation is not pursued efficiently. Digital twins are emerging as a key enabling technology to improve the operation & maintenance of test benches for the wind industry. A digital twin combines physical systems and their digital models into a cyber-physical system to provide functionalities that cannot be attained by either physical or digital assets independently. The seamless integration of the test bench with digital models offered by a digital twin is expected to enhance the interaction between OEM and test bench operators. This proceeding illustrates the status of the development of the DIGIT-BENCH digital twin developed by R&D Test Systems (R&D) and Aarhus University to serve large-scale test facilities for the wind industry. The digital twin utilizes FMI-based co-simulation to enable the coupling of physical/digital components in an industrial-secret-friendly environment. The digital twin concept is demonstrated on a 2-degrees-of-freedom test bench installed at Aarhus University.

Kristensen2024: |
  Autonomous Systems (AS) enable systems to adapt to drastic and unprecedented environmental changes, a capability that can be enhanced through the utilization of Digital Twins (DTs). However, the additional capabilities of AS come at the cost of explainability, as the expanding adaptation space complicates the reasoning about the system’s behavior. For certain types of systems, it is crucial to ensure that specific properties are upheld despite the system’s autonomous behavior. To facilitate the monitoring of these properties, we propose the use of Runtime Verification (RV). This tutorial demonstrates the integration of RV tools into the Digital Twins as a Service (DTaaS) platform to monitor and verify the behavior of AS in real-time. By exploring various methods to incorporate RV tools within a DT context, the tutorial aims to advance the application of RV technologies in autonomic computing and self-adaptive system design. Specifically, we demonstrate how the behavior of a self-configuring DT can be verified utilizing RV. This is accomplished through the DTaaS platform, which supports seamless deployment of DT-based AS.

Larsen2024: |
  The robots of tomorrow should be endowed with the ability to adapt to drastic and unpredicted changes in their environment and interactions with humans. Such adaptations, however, cannot be boundless: the robot must stay trustworthy. So, the adaptations should not be just a recovery into a degraded functionality. Instead, they must be true adaptations: the robot must change its behaviour while maintaining or even increasing its expected performance, and staying at least as safe and robust as before. The RoboSAPIENS project will focus on autonomous robotic software adaptations, and will lay the foundations for ensuring that they are carried out in an intrinsically trustworthy, safe, and efficient manner, thereby reconciling open-ended self-adaptation with safety by design. RoboSAPIENS will transform these foundations into ‘first time right’-design tools and platforms, and will validate and demonstrate them.

Talasila2024: |
  Establishing digital twins is a non-trivial endeavour especially when users face significant challenges in creating them from scratch. Ready availability of re-usable models, data, functions, and tool assets, can help with creation and use of digital twins. A number of frameworks/platforms exist to facilitate creation and use of digital twins. In this paper we propose such a platform to manage digital twin assets, create composable digital twins from re-usable assets and make the digital twins available as a service to other users. The proposed platform supports the management of re-usable assets, storage, provision of compute infrastructure, communication, monitoring and execution tasks. Two case studies are used to demonstrate the capabilities of this platform.

Tang2024: |
  We introduce a novel event-trigger threshold (ETT) regulation mechanism based on the quantitative semantics of propositional logic (PL). We exploit the expressiveness of the PL vocabulary to deliver a precise and flexible specification of ETT regulation based on system requirements and properties. Additionally, we present a modified ETT regulation mechanism that provides formal guarantees for satisfaction/violation detection of arbitrary PL properties. To validate our proposed method, we consider a convoy of vehicles in an adaptive cruise control scenario. In this scenario, the PL operators are used to encode safety properties and the ETTs are regulated accordingly, e.g., if our safety metric is high there can be a higher ETT threshold, while a smaller threshold is used when the system is approaching unsafe conditions. Under ideal ETT regulation conditions in this safety scenario, we show that reductions between 41.8 - 96.3% in the number of triggered events is possible compared to using a constant ETT while maintaining similar safety conditions.

Nordtorp2024: |
  As wind turbines continue to increase in size, hybrid testing is emerging as a key-enabling solution for experimental assessment of their large mechanical components. Hybrid testing is conducted using a hybrid model which combines physically tested and numerically simulated components. In this work, the Kane method is proposed to formulate the equation of motion for the hybrid model of a wind turbine rotor system where one single blade is physically tested. The Kane method allows for formulating the equation of motion of multi-body-dynamic models efficiently and, therefore, it is widely used in state-of-art simulation software. The hybrid model of the rotor is successfully implemented on a single-degree-of-freedom test bench with a cantilever steel beam serving as the physical substructure. The performance of the implemented hybrid model is assessed through a comparison with a pure numerical simulation of the same system. The main finding of the study emphasizes the efficiency of incorporating physically measured restoring force as model parameters while formulating the equation of motion of a hybrid model.

David2024: |
  The widespread adoption of digital twins gave rise to emerging systems of interconnected digital twins, often dubbed aggregated or hierarchical digital twins. In such emerging systems, interoperability of digital twins is key in determining the capabilities and qualitative properties of the emerging system. In this paper, we report on a panel discussion that took place at the 2023 Annual Simulation Conference with four esteemed experts representing four distinct perspectives on the topic: strategic (why aggregated digital twins matter?), technical (how co-simulation supports a distributed set of concerns over multiple digital twins?), standardization (how standards enable interoperability?), and organizational (how organizations deal with digital twinning scenarios?). We report the panelists’ main arguments and synthesize them into a discussion. The main takeaway of the panel is that contrary to the state of affairs in digital twinning that limits interoperability to low levels, there is a clear need to reach higher levels of interoperability in digital twinning scenarios that necessitate a distributed approach. Moreover, there are emerging solutions to achieve these higher levels. To provide researchers with tangible leads, we distill challenges and success factors, and recommend future research directions in digital twin interoperability.

Gil2024a: |
  Digital Twins (DTs) can be constructed for many different applications, leading to substantial differences between different case studies. To be able to learn from the challenges and lessons learned by other DT practitioners, it is important that experience reports be consistent to facilitate comparisons. In this paper we merge three reference description frameworks for DTs, one generated from a systematic mapping study, one generated from an analysis of experience reports, and one from a systematic literature review, to come up with a unified characterization of DT applications. This analysis has identified six non-overlapping and three cross-cutting characteristics in the reference frameworks. This paper showcases the unified characterization with 21 characteristics to report on a DT case study called the Flex-cell, a manufacturing cell with two robotic arms used for cooperative assembly. The generalizability of this unified characterization is validated using a multi-case approach with another case study in robotics and another in the food industry. We call on the DT community to integrate these systematic reporting principles in their future DT experience reports such that other practitioners can learn from each other more effectively.

Oakes2024: |
  The systematic engineering of Digital Twins (DTs) requires the establishment of clear methodologies supported by intelligent tooling. We propose an approach to guide the user in the creation and deployment of services for DTs utilizing ontologies and workflows. In our approach, the user selects a desired DT service from an array of options. This selection is then used to suggest a) enablers and models to place in the DT, and b) development and deployment workflows for the DT service. The aim is to provide DT engineering guidance to assist non-software engineering experts to develop DT services more rapidly with less effort. We describe our initial work on applying this approach to a derived version of an industrial wind turbine generator case study, utilizing openCAESAR for ontology definition and enacting the workflows with Jupyter notebooks.

Hansen2024: |
  When different simulation units are coupled together there are different choices to take, in particular regarding the granularity of such a co-simulation. When prototyping systems, it is typically favourable to get an initial idea of how a collection of simulation units work together without spending too much time setting up the orchestration. However, the granularity of such a simulation may be far away from what is needed in relation to the purpose of the simulation. In order to enable more flexibility and control over the co-simulation it is necessary to be able to steer the orchestration in a more detailed manner. This paper presents an open source co-simulation orchestration engine based on the Functional Mockup Interface standard but with a Domain Specific Language (DSL) enabling detailed control between the individual simulation units. The same tool can thus be used right out of the box for low-granularity co-simulation, and for high-granularity simulation the DSL enable a significant flexibility.

Gil2024: |
  Digital twin (DT) technology has been a topic with academic and industrial coverage in recent years. DTs are intended to be a virtual high-fidelity representation of a physical counterpart. Its complex nature requires several components to create and run a DT, and that is why many DT frameworks have been proposed in the literature. There are also many surveys of DTs, but none that is bottom-up with concrete examples and focused on open-source software. This survey analyzes 14 open-source DT frameworks in 10 different dimensions, which are then categorized in six different groups according to their modeling and technological domain, to present the reader different options for creating and managing DT applications, and to understand potential combinations, uses, and limitations of the tools. It also presents a case study with five of the explored DT frameworks, describing the process on how the DT is set up and comparing their capabilities based on the services to be provided by the DT. Finally, it discusses advantages and limitations of the tools according to domain, requirements, and scope, relevant aspects regarding built-in simulations and data analytics, theory-to-practice transition, and advantages/disadvantages of using open-source software instead of commercial. Main limitations of the study due to its narrow niche, conclusions, and opportunities for future research regarding the potential room for improvement in terms of out-of-the-box features and services for DTs, are also shown.

Paredis2023: |
  Digital Models/Shadows/Twins/. . . have been given numerous definitions and descriptions in the literature. There is no consensus on terminology, nor a comprehensive description of workflows nor architectures. In this paper, we use the catch-all “Digital T” (pronounced “Digital Twinning”) to refer to all concepts, techniques, architectures, . . . related to the “twinning” paradigm. In this paradigm, virtual instances, known as twins, of a System under Study (SuS) are continually updated with the SuS’s health, performance, and maintenance status, over its entire life-cycle. Digital T can be used for monitoring, analysis, optimization, and adaptation of complex engineered systems, in particular after these systems have been deployed. Digital T makes full use of both historical knowledge and of streaming data from sensors. Following Multi-Paradigm Modelling (MPM) principles, this paper proposes to explicitly model construction/use workflows as well as architectures and deployment of Digital T. Applying product family modelling allows for the de-/re-construction of the different Digital T variants in a principled, reproducible and partially automatable manner. Two small illustrative cases are discussed: a Line-Following Robot and an Incubator. These are representative for respectively an Automated Guided Vehicle and an Industrial Convection Oven, both important in an industrial context.

Kazemi2023: |
  The ability to move production between different geographical locations has recently become more important, due to the increasing need for sustainability and faster response times, complying with local regulations, and dealing with brittle international supply chains. To this end, the movable factory concept has been put forward, which is defined as mobile production units that can be installed near the customer’s location. Unfortunately, industrial paradigms such as Industry 4.0 make little if any notice of movable factories but instead focus on the digitalization of their fixed counterparts. In the form of a systematic literature review, this paper breaks down the concept of the movable factory, relates it to the state-of-the-art, and summarizes its main use cases, requirements, research gaps, and opportunities. The review covers over 100 relevant articles published in the past two decades. Compared to existing surveys, we have not only focused on the motivations for movable factories, but also identified research gaps and discuss the impact of modern technologies such as Internet-of-Things, digital twins, and modeling and simulation in fulfilling these gaps. The result is a survey of the state-of-the-art and a list of domains for potential future research on different aspects of movable factories.

Talasila2023: |
  Establishing digital twins is a non-trivial endeavour especially when users face significant challenges in creating them from scratch. Ready availability of reusable models, data and tool assets, can help with creation and use of digital twins. A number of digital twin frameworks exist to facilitate creation and use of digital twins. In this paper we propose a digital twin framework to author digital twin assets, create digital twins from reusable assets and make the digital twins available as a service to other users. The proposed framework automates the management of reusable assets, storage, provision of compute infrastructure, communication and monitoring tasks. The users operate at the level of digital twins and delegate the rest of the work to the digital twin as a service framework.

Loper2023: |
  Providing the appropriate infrastructure for simulation is the topic of this chapter of the SCS M&S Body of Knowledge. It provides sections on various simulation standards, standard organizations, and compliance certificates. Publications of some applicable codes of best practices and lessons learned are provided as well as a section on resource repositories. The currently dominant standard Distributed Interactive Simulation (DIS) and High-Level Architecture (HLA) conclude the chapter.

Bottjer2023: |
  In recent years, the hype around Digital Twins (DTs) has been exponentially increasing in both industry and academia. DTs are a potential solution to increase automation and advance towards Smart Manufacturing. Manufacturing DTs have been implemented at different hierarchical levels, ranging from system of systems to unit level. Increasing computational capacity and data exchange rates can enable DT implementations for real-time applications. Several literature reviews on manufacturing DTs have been published. However, no previous paper focuses on manufacturing DTs at the unit level for which real-time control is most applicable. Simultaneously, the challenges to engineer DTs with real-time capabilities are enormous, both from a scientific and technological perspective. Therefore, we focus on DTs of single production units such as traditional machine tools, additive manufacturing machines and advanced robotic applications. In this systematic literature review, 96 papers about practical unit level DT applications found in the Scopus database using a combination of the keywords “Digital Twin”, “Production” and “Manufacturing” are reviewed. We summarize how DTs are currently implemented and operated, and what potential benefits DTs offer at the unit process level in four categories: generic reference models, services, DT content (models and data) and DT deployment (hardware and software). Following the thematic analysis, an overall discussion, summary of key contributions and identified research gaps, and outlook into future research avenues is given. Key findings of this review can be summarized as: focus on DT components versus being holistic; need to share data and models across multiple stakeholders; lack of physical fidelity of the models; stark contrast of lab scale developments and real world testing, e.g., historical data and storage related challenges; lack of clear definition of DT in industry, and missing semantic interoperability between a wide variety of domains.

Abbiati2023: |
  The failure mode of a structural component subjected to fire loading is sensitive to its mechanical boundary conditions. It follows that controlling boundary conditions is crucial to obtain a realistic loading scenario with a fire experiment. Hybrid fire testing has been developed for this purpose. Specifically, a structural component under test is loaded using actuators and exposed to fire loading. A coordination algorithm updates actuator setpoints on the fly so that the tested structural component experiences the sought mechanical boundary conditions, e.g., associated with a virtual assembly that is simulated numerically. To enable interoperability of simulation tools and control systems utilized in hybrid testing, a number of middlewares have been proposed, some of which have been adapted to hybrid fire testing. Middlewares facilitate the implementation of hybrid fire testing within the same laboratory. However, the portability of hybrid models from one laboratory to another is critical when different middleware and simulation tools are adopted. A consequence of that is that round-robin verification cannot be easily deployed for hybrid fire testing. In response to this limitation, this paper proposes to craft hybrid fire testing experiments using the Co-Simulation paradigm supported by the Functional Mock-up Interface standard. The methodology is demonstrated experimentally.

Alfalouji2023: |
  Modeling buildings and smart energy systems requires coupling a wide range of components into one unified simulation process, which can be difficult given the complexity of these systems. Hence, a large number of researchers integrate separate simulations for each of the individual components in a co-simulation instead. To systematically analyze techniques, standards, tools and applications of co-simulation in the field of buildings and smart energy systems, the publications on co-simulations in this field are reviewed by means of taxonomic analysis. Furthermore, the reproducibility as well as the validation approach of the respective papers are evaluated. Results show that Functional Mock-up Interface (FMI) is the most prominent standard for co-simulation in modeling buildings and smart energy systems. Co-simulation is mostly used in Heating, Ventilation, and Air Conditioning (HVAC) and occupancy analysis applications. Since nearly 70% of publications are not reproducible, we advocate that journals and funding agencies adopt stricter data and code-sharing policies.

Naseri2023: |
  Transportation electrification has been fueled by recent advancements in the technology and manufacturing of battery systems, but the industry yet is facing serious challenges that could be addressed using cutting-edge digital technologies. One such novel technology is based on the digital twining of battery systems. Digital twins (DTs) of batteries utilize advanced multi-layer models, artificial intelligence, advanced sensing units, Internet-of-Things technologies, and cloud computing techniques to provide a virtual live representation of the real battery system (the physical twin) to improve the performance, safety, and cost-effectiveness. Furthermore, they orchestrate the operation of the entire battery value chain offering great advantages, such as improving the economy of manufacturing, re-purposing, and recycling processes. In this context, various studies have been carried out discussing the DT applications and use cases from cloud-enabled battery management systems to the digitalization of battery testing. This work provides a comprehensive review of different possible use cases, key enabling technologies, and requirements for battery DTs. The review inclusively discusses the use cases, development/integration platforms, as well as hardware and software requirements for implementation of the battery DTs, including electrical topics related to the modeling and algorithmic approaches, software architectures, and digital platforms for DT development and integration. The existing challenges are identified and circumstances that will create enough value to justify these challenges, such as the added costs, are discussed.

Bogomolov2023: |
  Digital Twin is a technology that facilitates a real-time coupling of a cyber-physical system and its virtual representation. The technology is applicable to a variety of domains and facilitates more intelligent and dependable system design and operation, but it relies heavily on the existence of digital models that can be depended upon. In realistic systems, there is no single monolithic digital model of the system. Instead, the system is broken into subsystems, with models exported from different tools corresponding to each subsystem. In this paper, we focus on techniques that can be used for a black box model, such as the ones implementing the Functional Mock-up Interface (FMI) standard, formal analysis, and verification. We propose two techniques for simulation-based reachability analysis of models. The first one is based on system dynamics, while the second one utilises dynamic sensitivity analysis to improve the quality of the results. Our techniques employ simulations to obtain the model’s sensitivity with respect to the initial state (or model’s Lipschitz constant) which is then used to compute reachable states of the system. The approaches also provide probabilistic guarantees on the accuracy of the computed reachable sets that are based on simulations. Each technique requires different levels of information about the black box system, allowing the readers to select the best technique according to the capabilities of the models. The validation experiments have demonstrated that our proposed algorithms compute accurate reachable sets of stable and unstable linear systems. The approach based on dynamic sensitivity provides an accurate and, with respect to system dimensions, more scalable approach, while the sampling-based method allows a flexible trade-off between accuracy and runtime cost. The validation results also show that our approaches are promising even when applied to non-linear systems, especially, when applied to larger and more complex systems. The reproducibility package with code and data can be found at https://github.com/twright/SIM-Black-Box-Reachability.

Inci2023: |
  In serial co-simulation, the subsystems are solved and exchange their variables subsequently. For this reason, the solution sequence of the subsystems plays an important role. Prior work has demonstrated the effect of solution sequence on the accuracy of serial co-simulation and proposed an adaptive scheduling algorithm that predicts when to change the solution sequence using global input estimation error. This paper introduces another mechanism that considers physical causality to determine the computational causality in the co-simulation. We benchmark this method against input estimation error and static solution sequences in adaptive scheduling algorithm in serial co-simulations of a linear problem. The resulting method generally avoids the worst solution sequence and mitigates the risk of co-simulation being unstable if one of the sequences produces a greater error.

Oakes2023: |
  Digital Twins (DTs) are built using modelling and simulation techniques in complex domains such as cyber-physical systems. However, further formal investigation is required for how a DT and the services it provides relate to the qualities of the models used by a service. Specifically, this article examines when a DT service can be said to have the qualities of relevant, verifiable, substitutable, and faithful based on the results of checking properties in comparison to the actual system. Using an incubator system as our running example, we show how a DT service relies on multiple models, present the consequences when these qualities are violated, and discuss strategies for adapting models to ensure these qualities.

Hansen2023: |
  An essential part of building reliable cyber-physical systems is to be able to predict the behavior of such systems using accurate simulations. Standards for describing the behavior of such systems and simulations are evolving to facilitate a broader range of applications. The Functional Mockup Interface (FMI) standard is no exception. FMI 3.0 introduces synchronous clocks to facilitate efficient and repeatable simulation of event-driven systems. Nevertheless, the standard does not specify how to implement the synchronization of models, and it is up to the tool vendors to implement the orchestration algorithm responsible for this task. This paper presents the first approach to synthesizing the orchestration algorithm for FMI 3.0 supporting synchronous clocks. A prototype implementation of the algorithm is presented.

Frasheri2023: |
  Digital twins (DTs) represent a key technology in the development, real-time monitoring and optimisation of cyber-physical systems (CPSs). Such potential emerges as a result of the real-time coupling between DTs and their physical counterparts, where it is possible to make use of operational data as it is being generated in order to aid decision-making. Harnessing this potential presents several design challenges, such as the parallel operation of the DT and its physical twin (PT), and the necessary synchronisation thereof, to ensure coherent execution of the system in ensemble. In this paper we present an approach that handles situations where a DT and its PT get out of sync as a result of disturbances in the normal operational conditions of the DT-PT system, e.g., due to network degradation or temporary network drop. The purpose is to provide a best-effort functionality covering: user notification, degradation of DT to digital shadow (DS), with recovery mechanisms to re-establish the synchronisation between DT and PT.

Feng2022a: |
  In recent years the concept of Digital Twins (DTs) has gained significant attention, in particular in the manufacturing industry. In proper DTs there is a bidirectional connection to/from their Physical Twins such that it is possible to leave humans out of the loop. However, the underlying ideas of DTs have been inspired from a number of different scientific communities, in particular in relation to autonomy including the “Monitor-Analyze-Plan-Execute over a shared Knowledge” (MAPE-K). In this paper, we bridge the two concepts by demonstrating an implementation of a MAPE-K loop for an incubator case study within the context of its DT. We also discuss some of the limitations of the MAPE-K concept when applied to Cyber-Physical Systems (CPS).

Feng2022: |
  The synchronization between a Digital Shadow (DS) and a Cyber-Physical System (CPS) is paramount to enable anomaly detection, predictive maintenance, what-if analysis, etc. Such synchronization means that a simulation reflects, as closely as possible, the states of the CPS. The simulation however, requires the complete initial state of the system to be known, which is often infeasible in real applications. In our work, we study the conditions under which knowing the initial state of the system is irrelevant for a simulation to eventually synchronize with the CPS. We apply traditional stability analysis to answer this question for linear periodic systems. We demonstrate the method using a simple but representative system, an incubator with a periodic control signal.

Hansen2022a: |
  This paper presents an overview and formalization of the Functional Mock-up Interface (FMI) 3.0. The formalization captures the new FMI 3.0 standard and is intended to be used as an introduction for conceptualizing the use of clocks in the FMI standard to support the simulation of event-based cyber-physical systems. The FMI 3.0 standard supports two kinds of clock-based simulations: Synchronous Clocked Simulation to ensure predictable systems scheduling with multiple simultaneous events and scheduled execution to facilitate real-time simulations comprising multiple black-box models by allowing fine-grained control over the computation time of submodels. The formalization is a basis for developing tools for orchestrating, verifying and validating the composition of multiple FMUs. The formalization is provided as an accessible VDM-SL specification.

Hansen2022: |
  Simulation-based analyses are becoming increasingly vital for the development of cyber-physical systems. Co-simulation is one such technique, enabling the coupling of specialized simulation tools through an orchestration algorithm. The orchestrator describes how to coordinate the simulation of multiple simulation tools. The simulation result depends on the orchestration algorithm that must stabilize algebraic loops, choose the simulation resolution, and adhere to each simulation tool’s implementation. This paper describes how to verify that an orchestration algorithm respects all contracts related to the simulation tool’s implementation and how to synthesize such tailored orchestration algorithms. The approaches work for complex and adaptive co-simulation scenarios and have been applied to several real-world case studies.

Kakavandi2022: |
  Evaluating the product quality in an assembly machine is critical yet time-consuming since, in product assessment in batch manufacturing, a certain amount of products should be investigated in an invasive manner. However, continuous manufacturing ensures product quality assessment during assembly with high efficiency and traceability. This paper proposes a quality assessment method for an industrial use case. First, the data is prepared based on two indicators and expert knowledge. Then two data classification approaches (one-class classification and binary classification) are applied to evaluate the products’ quality by analysing the related data. Finally, the most efficient model is selected to predict the product labels and deviate anomalies from normal products. For the studied use case and the limited number of products, the binary classifier guarantees to detect 100% of defective products. The proposed approach can provide the engineers and operators with understandable extracted process knowledge, and can therefore be adapted to a high-speed manufacturing line where large data volume and process complexity can be problematic.

Kulik2022: |
  Advanced digital technology is finding its way into industrial production and control systems. This led to development of further concepts such as digital shadow and digital twin. In the former an accurate model of the cyber-physical system (CPS) is used to monitor it virtually, while the latter provides a possibility to adapt the CPS’s behavior. These developments are often welcome from the operators perspective, however they also pose new challenges in terms of cyber security: an operator could be led to believe the system is operating correctly due to the represented digital image while the CPS is under a cyber attack. In this paper we investigate several cyber security challenges of the digital twin technology and discuss potential mitigations for these challenges based on well established practices within the area of industrial control systems. We further describe the potential cyber attacks and mitigations using a semi-formal notation based on problem frames, we suggest in order to simplify the communication about cyber security challenges of digital twins between different stakeholders. This is shown within a context of a small case study. Finally we outline areas of research for the development of secure digital twin technology.

Madsen2022: |
  We introduce AURT, an open-source software for modeling and calibration of robot manipulator dynamics. AURT includes rigid-body dynamics and a selection of joint dynamics models. The separation of the robot dynamics into rigid-body dynamics and joint dynamics allows for fast recalibration of the robot dynamics using different joint dynamics models. We evaluate the calibration performance using a Universal Robots UR5e robot manipulator. We also demonstrate how the joint dynamics models embedded in AURT outperforms the standard approach of the state of the art.

Tola2022: |
  The amount of robots in industry is increasing, pushing the need for easier configuration and integration of robots. The cost of robot integration is often larger than the cost of the robots themselves. With the increasing complexity of robotic systems and the tasks they perform, the future of reducing the expenses of robot system integration is significant. In this position paper, we report on some of the main challenges in robot system configuration, and give an overview of the current state-of-the-art of robot system configuration. We briefly look into the configuration of personal computers (PCs) and study how the robot system configuration can be improved inspired by the standards used in the PC area. We conclude with concrete proposals as to what can be done in the future, to make the process of robot system configuration and integration easier and cheaper.

Wright2022: |
  The performance and reliability of Cyber-Physical Systems are increasingly aided through the use of digital twins, which mirror the static and dynamic behaviour of a Cyber-Physical System (CPS) in software. Digital twins enable the development of self-adaptive CPSs which reconfigure their behaviour in response to novel environments. It is crucial that these self-adaptations are formally verified at runtime, to avoid expensive re-certification of the reconfigured CPS. In this paper, we demonstrate formally verified self-adaptation in a digital twinning system, by constructing a non-deterministic model which captures the uncertainties in the system behaviour after a self-adaptation. We use Signal Temporal Logic to specify the safety requirements the system must satisfy after reconfiguration and employ formal methods based on verified monitoring over Flow* flowpipes to check these properties at runtime. This gives us a framework to predictively detect and mitigate unsafe self-adaptations before they can lead to unsafe states in the physical system.

Bottjer2021: |
  Throughout their useful life, plastic injection moulds operate in rapidly varying cyclic environments, and are prone to continual degradation. Quantifying the remaining useful life of moulds is a necessary step for minimizing unplanned downtime and part scrap, as well as scheduling preventive mould maintenance tasks such as cleaning and refurbishment. This paper presents a data-driven approach for identifying degradation progression and remaining useful life of moulds, using real-world production data. An industrial data set containing metrology measurements of a solidified plastic part, along with corresponding lifecycle data of 13 high production volume injection moulds, was analyzed. Multivariate Statistical Process Control techniques and XGBoost classification models were used for constructing data-driven models of mould degradation progression, and classifying mould state (early run-in, production, worn-out). Results show the XGBoost model developed using element metrology & relevant mould lifecycle data classifies worn-out moulds with an in-class accuracy of 88%. Lower in-class accuracy of 73% and 61% were achieved for the compared to mould-worn out less critical early run-in and production states respectively.

Esterle2021: |
  Digital twins are digital representations of cyber-physical systems, allowing bi-directional data and control flow between them. In this paper, we introduce the digital twin concept in self-integrating and self-improving systems. Specifically, we highlight the usage of digital twin models for autonomous systems spontaneously interacting with each other and aiming to improve collaboration and mutual safety. We present the main challenges and an initial architecture to enable autonomous cyber-physical systems to collaborate, self-integrate, and self-improve during run-time.

Feng2021b: |
  As a result of the fast development of technologies and diversity of requirements, complexity exists not only in a system itself but also in the development process and environment. The complexity in the development process comes from specialization and concurrency, and a Digital Twin (DT) has the potential to mitigate these issues. We hope, during the process of building a DT, the accidental complexity can be minimized by application of model-based systems engineering and the Multi-Paradigm Modeling (MPM). In this paper, we give an example of the process of building a DT combined with a process model. Our long term goal is to model the development of various DTs to identify the commonalities and variations across multiple DTs.

Feng2021a: |
  Cyber-Physical Systems (CPSs) are getting increasingly complex and generate large amounts of data. Analyzing such data provides us an insight into a given system. The digital twin concept emerges as an attempt to seamlessly integrate the data and insight in order to improve system performances. It enables applications such as visualization, monitoring, state estimation, and self-adaptation. In this paper, we demonstrate the construction of a digital twin exemplified by an incubator system, including the benefits and challenges of each application. The result is a description of the building blocks of a digital twin.

Feng2021: |
  To demystify the Digital Twin concept, we built a simple yet representative thermal incubator system. The incubator is an insulated box fitted with a heatbed, and complete with a software system for communication, a controller, and simulation models. We developed two simulation models to predict the temperature inside the incubator, one with two free parameters and one with four free parameters. Our experiments showed that the latter model was better at predicting the thermal inertia of the heatbed itself, which makes it more appropriate for further development of the digital twin. The hardware and software used in this case study are available open source, providing an accessible platform for those who want to develop and verify their own techniques for digital twins.

Gomes2021a: |
  Hybrid testing is an experimental technique extensively utilized in earthquake engineering to study the seismic response of structures. It requires coupling physical and numerical models in a closed feedback loop. Although this methodology is mature, a commonly accepted standard for orchestrating simulations and experiments is still missing. As a result, setting up a hybrid testing campaign still requires substantial system integration effort, which is often not affordable. In this paper, we propose the Functional Mockup Interface as a possible standard for orchestrating hybrid testing and discuss the limitations in enabling such support.

Gomes2021: |
  This paper gives an overview of the FMI 3.0 support for two kinds of clock-based simulations: Synchronous Clocked Simulation, and Scheduled Execution. The former is used when the information about multiple simultaneous events (cause and exact time of occurrence) can be unambiguously conveyed. The later facilitates real-time simulations comprising multiple black-box models, by allowing fine grained control over the computation time of sub-models. A formalization is presented along with example application scenarios, meant as an introduction to the conceptualization of clocks in the FMI Standard.

Hansen2021a: |
  Simulation-based analyses of cyber-physical systems are becoming increasingly vital. Co-simulation is one such technique that enables the coupling of specialized simulation tools through an orchestration algorithm that dictates when, with which inputs, and how far each simulation tool should advance its corresponding subsystem. The result of a co-simulation is often sensitive to the orchestration algorithm. This algorithm should be designed based on the simulation tool’s implementation to minimize the co-simulation error. The paper extends current graph-based approaches for generating implementation-aware simulation algorithms to cover complex co-simulation scenarios where step negotiation and algebraic loops are part of the simulation. We show how the generation takes place for different complex co-simulation scenarios. An implementation of the approach is available online.

Hansen2021b: |
  Simulation-based analyses of cyber-physical systems are increasingly vital. Co-simulation is one such technique that enables the coupling of specialized simulation tools through an orchestration algorithm. The orchestrator dictates how each simulation tool should simulate its corresponding subsystem. Obtaining correct simulation results requires an implementation-aware orchestration algorithm tailored to the specific scenario, without the orchestrator knowing each simulation tool’s implementation. Such an algorithm should stabilize algebraic loops, perform time step negotiation, and adhere to each simulation tool’s implementation. This paper describes an approach and implementation to prove that a given orchestration algorithm respects all contracts related to the simulation units’ implementation. The approach has been applied to an industrial case study and other complex scenarios. The tool and results are available online.

Hansen2021: |
  The accuracy of the result of a co-simulation is dependent on the correct initialization of all the simulation units. In this work, we consider co-simulation where the simulation units are described as Functional Mock-up Units (FMU). The Functional Mock-up Interface (FMI) specification specifies constraints to the initialization of variables in the scope of a single FMU. However, it does not consider the initialization of interconnected variables between instances of FMUs. Such interconnected variables place particular constraints on the initialization order of the FMUs. The approach taken to calculate a correct initialization order is based on predicates from the FMI specification and the topological ordering of both internal connections and interconnected variables. The approach supports the initialization of co-simulation scenarios containing algebraic loops using fixed point iteration. The approach has been realized as a plugin for the open-source INTO-CPS Maestro 2 Co-simulation framework. It has been tested for various scenarios and compared to an existing Initializer that has been validated through academic and industrial application.

Inci2021: |
  In non-iterative serial co-simulation, the solution sequence of the systems is ordered either ad-hoc or based on the solution priorities. The selection of the priorities determines which systems approximate the upcoming inputs from connected systems. This input estimation causes an error on the time integration of the states. This article discusses indicators to estimate the extent of input estimation contribution on the overall state calculation error and addresses to the question if the solution sequence has an influence on the state evolution. Moreover, a temporal analysis of this effect is studied to predict when to flip the sequence at an interface between two systems on a linear numerical example. In conclusion, an adaptive algorithm which switches the co-simulation sequence run-time based on the input estimation accuracy is proposed and validated with a parameter study.

Junghanns2021: |
  The Functional Mock-up Interface (FMI) (Modelica Association 2021b) is a tool independent standard for the exchange of dynamic models and for co-simulation. FMI 2.0, released in 2014, is recognized as the de-facto standard in industry for exchanging models and tool coupling, and is currently supported by more than 160 simulation tools. Version 3.0 of the standard brings many new features that allow for advanced co-simulation algorithms and new use cases such as packaging and simulation of highly accurate virtual Electronic Control Units (vECUs). Besides Model-Exchange and Co-Simulation, a third interface type, Scheduled Execution, is defined for purely discrete, RTOS-like, simulation and supports preemption. Clocks allow the synchronization of events between Functional Mock-up Units (FMUs) and the importer. There is better support for data types including binary data and arrays. Advanced co-simulation approaches are enabled by intermediate variable access between communication points and allowing event handling. The composition of systems from FMUs is simplified by terminals that can bundle multiple signals. The concept of layered standards allows the extension of the FMI standard.

Legaard2021a: |
  Dynamical systems see widespread use in natural sciences like physics, biology, chemistry, as well as engineering disciplines such as circuit analysis, computational fluid dynamics, and control. For simple systems, the differential equations governing the dynamics can be derived by applying fundamental physical laws. However, for more complex systems, this approach becomes exceedingly difficult. Data-driven modeling is an alternative paradigm that seeks to learn an approximation of the dynamics of a system using observations of the true system. In recent years, there has been an increased interest in applying data-driven modeling techniques to solve a wide range of problems in physics and engineering. This paper provides a survey of the different ways to construct models of dynamical systems using neural networks. In addition to the basic overview, we review the related literature and outline the most significant challenges from numerical simulations that this modeling paradigm must overcome. Based on the reviewed literature and identified challenges, we provide a discussion on promising research areas.

Oakes2021: |
  Co-simulation is a powerful technique for performing full-system simulation. Multiple black-box models and their simulators are combined together to provide the behaviour for a full system. However, the black-box nature of co-simulation and potentially infinite configuration space means that configuration of co-simulations is a challenging problem for today’s practitioners. Our previous work on co-simulation configuration operated on the notion of hints, which allow system engineers to encode their knowledge and insights about the system. These hints, combined with state-of-the-art best practices, can then be used to semi-automatically configure the co-simulation. We summarize our previous hint-based configuration work here, and explore the challenging problem of scheduling co-simulations which contain algebraic loops. Solving or “breaking” these loops is required for scheduling, yet this breaking process can induce errors in the co-simulation. This work formalizes this scheduling problem, presents our insights gained about the problem, and details an optimal search algorithm as well as greedy scheduling algorithms. These heuristic algorithms are evaluated on (synthetic) co-simulation scenarios to determine their relative speedup and optimality.

Paredis2021: |
  Digital Twins (DTs) can be used for optimization, analysis and adaptation of complex engineered systems, in particular after these systems have been deployed. DTs make full use of both historical knowledge and of streaming data from sensors. DTs have been given numerous (distinct) definitions and descriptions in the literature. There is no consensus on terminology, nor a comprehensive description of workflows nor architectures. Following Multi-Paradigm Modelling principles, this paper proposes to explicitly model construction and use workflows of DTs as well as their architectures. We apply the concepts of variability (also known as product family) modeling, in particular to DT workflow and architecture. This allows for the de-/re-construction of the different DT variants in a principled, reproducible and partially automatable manner. To illustrate our ideas, two small use cases are discussed: a line-following robot (representative for an Automated Guided Vehicle) and an incubator (representative for an Industrial Convection Oven). The use cases focus on important systems in an industrial context.

Tola2021: |
  Determining which components are required for a system configuration, and whether they are compatible, can be a difficult task, especially in an industry with significant amounts of information that resides within a group of experts. In this paper we illustrate some of the main challenges we and our industrial partner (Technicon) face when configuring a robot system (typically consisting of a robotic arm, end effector, coupling device, and a base) and present our domain model, Robot System Configurator Information Model (RoboCIM). We formalise the model within a defeasible reasoning framework, in order to explicitly capture cases where information is missing or is obtained from the system integrators’ experience. We provide a prototype implementation of the framework in ASP and evaluate it on a subset of components from Technicon’s component catalogue, illustrating the feasibility of the configurator.

Woodcock2021: |
  A digital twin for a Cyber-Physical System includes a simulation model that predicts how a physical system should behave. We show how to quantify and characterise violation events for a given safety property for the physical system. The analysis uses the digital twin to inform a runtime monitor that checks whether the noise and violations observed fall within expected statistical distributions. The results allow engineers to determine the best system configuration through what-if analysis. We illustrate our approach with a case study of an agricultural vehicle.

Gomes2020: |
  The description of a complex system in terms of constituent components and their interaction is one of the most natural and intuitive ways of decomposition. Causal Block Diagram (CBD) models combine subsystem blocks in a network of relationships between input signals and output signals. Popular modelling and simulation tools such as Matlab/Simulink® implement different variants from the family of Causal Block Diagram formalisms. This chapter gives an overview of modelling and simulation of systems with software and physical components using Causal Block Diagrams. It describes the syntax and - both declarative and operational - semantics of CBDs incrementally. Starting from simple algebraic models (no notion of time), we introduce, first a discrete notion of time (leading to discrete-time CBDs) and subsequently, a continuous notion of time (leading to continuous-time CBDs). Each new variant builds on the previous ones. Because of the heavy dependency of CBDs on numerical techniques, we give an intuitive introduction to this important field, pointing out main solutions as well as pitfalls.

Gomes2020a: |
  A successful co-simulation standard is crucial in applying co-simulation in large scale distributed development processes. A factor that affects the success of a standard is how easily a vendor can implement it. In this paper, we describe an approach to facilitate the implementation of the Functional Mock-up Interface standard. In particular, we propose the use of model-based testing for evaluating the tools that export Functional Mock-up Units (FMUs). This has the benefit that the model used as documentation to describe the possible behaviors of an FMU, can also be used to test it. These principles are embodied in a tool, which is open source, and available online. We then use this tool to evaluate the FMUs available in the FMI Crosscheck repository.

Gomes2020b: |
  Correct co-simulation results require a careful consideration of how the interacting simulators are implemented. In version 2.0 of the FMI Standard, input handling implementation is left implicit, which leads to the situation where a simulator can be interacted with in a manner that its implementation does not expect, yielding incorrect results. In this paper, we build on prior work to make information about each simulator implementation explicit, in order to derive correct interactions with it. The formalization we use is specific to two kinds of contracts, but could serve as a basis to a general approach to black box co-simulation. The algorithm we propose generates a co-simulation execution plan in linear time. It has been successfully applied to an industrial case study, and the results are available online.

Larsen2020: |
  The successful development of Cyber-Physical Systems (CPSs) requires collaborative working across diverse engineering disciplines, notations and tools. However, classical computing curricula rarely provide opportunities for students to look beyond the confines of one set of methods. In this paper, we report approaches to raising students’ awareness of the integrative role of digital technology in future systems development. Building on research in open but integrated tool chains for CPS engineering, we consider how this has been realised in two degree programmes in Denmark and the UK, and give preliminary findings. These include the need for ensuring stability of research-quality tools, and observations on how this material is presented in Computing versus Engineering curricula.

Legaard2020: |
  During the development of Cyber-Physical Systems (CPSs), it is crucial to enable efficient collaboration between different disciplines. Co-simulation plays a key role in this by allowing the system as a whole to be simulated by composing simulations of its parts. The ability to do this coupling relies on the models adhering to a well-defined interface. The Functional Mockup Interface (FMI) defines this interface and the models that implemented it are called Functional Mockup Units (FMUs). While a wealth of specialized simulation tools can generate FMUs, they are often commercial and do not support of complex software prototypes. Rather than implement these as FMUs from scratch (FMI requires expertise in C), losing valuable time, the contribution presented in this paper is a tool that allows FMUs to be implemented rapidly in Python. The advantages of this approach are demonstrated in an industrial use case, where a tracking simulator is implemented as an FMU.

Legat2020: |
  In this paper, we analyse the impact of delayed event detection on the stability of a 2-mode planar hybrid automata. We consider hybrid automata with a unique equilibrium point for all the modes, and we find the maximum delay that preserves stability of that equilibrium point. We also show for the class of hybrid automata treated that the instability of the equilibrium point for the equivalent hybrid automaton with delay in the transitions is equivalent to the existence of a closed orbit in the hybrid state space, a result that is inspired by the Joint Spectral Radius theorem. This leads to an algorithm for computing the maximum stable delay exactly. Other potential applications of our technique include co-simulation, networked control systems and delayed controlled switching with a state feedback control.

Legat2020a: |
  In this paper, we analyse the impact of delayed event detection on the stability of a 2-mode planar hybrid automata. We consider hybrid automata with a unique equilibrium point for all the modes, and we find the maximum delay that preserves stability of that equilibrium point. We also show for the class of hybrid automata treated that the instability of the equilibrium point for the equivalent hybrid automaton with delay in the transitions is equivalent to the existence of a closed orbit in the hybrid state space, a result that is inspired by the Joint Spectral Radius theorem. This leads to an algorithm for computing the maximum stable delay exactly. Other potential applications of our technique include co-simulation, networked control systems and delayed controlled switching with a state feedback control.

Thule2020: |
  Automated monitoring of deployed Cyber-physical Systems during operation can assist in detecting misbehavior. One way to achieve such monitoring is via co-simulation of a modelled system corresponding to the deployed system. Our work addresses the topic of brokering external data into an Functional Mock-up Interface 2.0 enabled co-simulation via a Functional Mock-up Unit (a simulation unit) called RabbitMQ FMU and an external message queue. Our contribution includes a formal specification that captures the semantics of RabbitMQ FMU and ensures a maximum delay on the messages relayed to the co-simulation even through an unreliable network. This formal specification is used to generate test cases that exercise all states and transitions. The implementation is subjected to these test cases to verify that it is a refinement of the specification. The verification is ongoing and the implementation has successfully been subjected to 1,539,246 tests.

Thule2020a: |
  An immediate industry challenge is to fashion a co-simulation that replicates real systems behaviour with high fidelity. To achieve this goal, developers rely on frameworks to enhance the creation and analysis of the co-simulation. The problem is that new co-simulation frameworks require extensive development, most of which in non-essential functionalities, before they can be used in practice. Additionally, existing co-simulations demand a thorough understanding before they can be extended. Our vision is a modular co-simulation framework architecture, that is easily extensible by researchers, and can integrate existing and legacy co-simulation approaches. The architecture we propose permits extension at three levels, each providing different degrees of flexibility. The most flexible integration level involves the specification of a Domain Specific Language (DSL) for Master Algorithm (MA) and this paper sketches such DSL, and discusses how it is expressive enough to describe well-known MAs.

Gomes2019d: |
  Modeling and Simulation (M&S) techniques are today extensively used both in industry and science, to develop and understand complex systems. As development processes morph to respond to economic pressures, they impose new demands on these techniques: • frequent full system evaluation is required to prevent late integration problems among specialized teams who worked in parallel on different, but interconnected, parts of the system; and • seamless integration of externally supplied component models into the M&S workflow of Original Equipment Manufacturers is needed to enable high fidelity simulations. Traditional M&S techniques, where a single model of the whole system is built and simulated, are insufficient to address these demands, because: • teams use mature M&S tools, each tailored to a particular domain, and not capable of exporting models that are compatible with any other M&S tool; and • external suppliers are not willing to share high fidelity models without expensive contracts protecting their Intellectual Property (IP). Co-simulation is a way to tackle these challenges. It consists of the theory and techniques to enable global simulation of a coupled system via the composition of simulators. Each simulator is broadly defined as a black box capable of exhibiting behavior, consuming inputs and producing outputs. This nature is also what aggravates the fundamental challenge in co-simulation: deciding whether the results can be trusted. This thesis is comprised of two parts. The first part explores the challenge, and tries to understand what makes co-simulation different than traditional simulation techniques. One of the conclusions of this part is the need to ensure that co-simulations preserve properties of the system being developed (e.g., stability, smoothness, etc. . . ). The second part represents a collection of work, each targeting an aspect of property preservation, including giving the users of co-simulation, the ability to control the implementation of participating simulators, and then providing a framework to help them do so correctly. The reported results provide a deeper understanding of the fundamental challenges that need to be addressed before co-simulation can become a seamless technique in the development of complex systems, including: 1. how to configure adaptive co-simulation algorithms that preserve stability; 2. how to configure state event location for co-simulation of hybrid systems; 3. a tool that allows the configuration of simulators participating in a co-simulation; and 4. a framework that guides the configuration of the co-simulation, so as to preserve domain specific description of system properties.

Gomes2019a: |
  The rapid adoption of co-simulation techniques allows for holistic complex system development. However, ensuring trustworthy results when combining simulators requires a careful consideration of their implementation and capabilities. Especially in black box integration, these are frequently left implicit. In this paper, we explore a way to account for simulator capabilities, by formalizing the execution of a co-simulation that respects such contracts. This formalization is specific to two kinds of contracts, but could serve as a basis to a general approach to black box co-simulation. An example application of the semantics to generate master algorithms is presented.

Gomes2019: |
  Simulation-based analyses of Cyber-Physical Systems are fundamental in industrial design and testing approaches. The utility of analyses relies on the correct configuration of the simulation tools, which can be highly complicated. System engineers can normally judge the results, and either evaluate multiple simulation algorithms, or change the models. However, this is not possible in a co-simulation approach. Co-simulation is a technique to perform full-system simulation, by combining multiple black-box simulators, each responsible for a part of the system. In this paper, we demonstrate the difficulty of correctly configuring a co-simulation scenario using an industrial case study. We propose an approach to tackle this challenge by allowing multiple engineers, specialized in different domains, to encode some of their experience in the form of hints. These hints, together with state-of-the-art best practices, are then used to semi-automatically guide the configuration process of the co-simulation. We report the application of this approach to a use case proposed by our industrial partners, and discuss some of the lessons learned.

Gomes2019e: |
  Co-simulation consists of the theory and techniques to enable global simulation of a coupled system via the composition of simulators for each of the components of the model. Despite the large number of applications and growing interest in the challenges, practitioners still experience difficulties in configuring their co-simulations. This tutorial introduces co-simulation of continuous systems, targeted at researchers that want to develop their own co-simulation units and master algorithms, using the Functional Mock-up Interface (FMI) Standard. This document is complemented by online materials (Gomes, Cláudio 2019) that allow the reader to experiment with different co-simulation algorithms, applied to the examples introduced here.

Moradi2019: |
  As society and industry relies more on Cyber-Physical Systems (CPS), any malfunctions can have unforeseen catastrophic failures. Fault Injection (FI) techniques perturbed a model of a CPS with the intention of causing a failure and measuring the robustness of the CPS. Naturally, the success of a FI simulation depends on three factors: (i) realism of the faults injected; (ii) how quickly the faults cause catastrophic failure; and (iii) fidelity of the model used. In this paper, we propose to improve the success rate of FI studies by addressing each one of these factors: we develop an algorithm that leverages traditional Sensitivity Analysis (SA) in hybrid systems to reduce an infinite fault search space to a optimal finite set (factors i,ii), and we use co-simulation as the model integration technique (factor iii). We evaluate our contribution on the power window system developed by MathWorks® .

Schweiger2019: |
  Co-simulation is a promising approach for the modelling and simulation of complex systems, that makes use of mature simulation tools in the respective domains. It has been applied in various different domains, oftentimes without a comprehensive study of the impact to the simulation results. As a consequence, over the recent years, researchers have set out to understand the essential challenges arising from the application of this technique. This paper complements the existing surveys in that the social and empirical aspects were addressed. More than 50 experts participated in a two-stage Delphi study to determine current challenges, research needs and promising standards and tools. Furthermore, an analysis of the strengths, weakness, opportunities and threats of co-simulation utilizing the analytic hierarchy process resulting in a SWOT-AHP analysis is presented. The empirical results of this study show that experts consider the FMI standard to be the most promising standard for continuous time, discrete event and hybrid co-simulation. The results of the SWOT-AHP analysis indicate that factors related to strengths and opportunities predominate.

Thule2019: |
  Cyber-Physical Systems (CPSs) often operate in a critical context where it is crucial that they behave as intended. However, the heterogeneous nature of CPSs makes them inherently challenging to develop. To assist in the development process, one can perform co-simulation, where models of constituents of a CPS are coupled to jointly simulate the full system. The challenge herein is to combine heterogeneous formalisms in a sound fashion and address practical needs such as stability, performance, platform compatibility and so forth. To address this, Maestro is a tool for co-simulation using models adhering to the Functional Mock-up Interface standard for Co-Simulation. Its development was driven by needs from different industry domains such as railways, agriculture, building automation and automotive. It supports both a fixed and variable constraint-based iteration scheme along with platform distribution capabilities. The tool is open-source as an attempt to increase adoption of co-simulation and encourage researchers to collaborate. Maestro has been validated by industry through application in the aforementioned domains. It is a step in the direction of the two-folded long-term goals: ensure trustworthy co-simulation results and make co-simulation a technology taken for granted.

Cambeiro2018: |
  Occupant behavior can wreck havoc in the performance indicators of smart building controllers, and this is usually caused by lack of knowledge about the operation of the system. However, there is evidence that the informed and motivated user will actually cooperate with the system. In this paper, we describe a system representative of the usual complexity found in cyber-physical systems, whose purpose is to address the chronic lack of real experiments involving gamification and control systems, in the context of building automation. Designed with pragmatic concerns, this system presents a unique set of challenges and opportunities to research a new generation of software control systems, and supporting interfaces, that leverage the occupants’ behavior.

Gomes2018d: |
  We propose an algorithm to restrict the switching signals of a constrained switched system in order to guarantee its stability, while at the same time attempting to keep the largest possible set of allowed switching signals. Our work is motivated by applications to (co-)simulation where numerical stability is a hard constraint, but should be attained by restricting as little as possible the allowed behaviours of the simulators. We apply our results to certify the stability of an adaptive co-simulation orchestration algorithm, which selects the optimal switching signal at run-time, as a function of (varying) performance and accuracy requirements.

Gomes2018c: |
  We propose an algorithm to restrict the switching signals of a constrained switched system in order to guarantee its stability, while at the same time attempting to keep the largest possible set of allowed switching signals. Our work is motivated by applications to (co)simulation where numerical stability is a hard constraint, but should be attained by restricting as little as possible the allowed behaviours of the simulators. We apply our results to certify the stability of an adaptive co-simulation orchestration algorithm, which selects the optimal switching signal at run-time, as a function of (varying) performance and accuracy requirements.

Gomes2018a: |
  Model-based design can shorten the development time of complex systems by the use of simulation techniques. However, it can be hard to simulate the system as a whole if it is developed in a concurrent fashion, by multiple and specialized teams. Co-simulation, with the support of the Functional Mock-up Interface (FMI) Standard, is proposed as a way to promote tool interoperability while protecting intellectual property of subsystems. The standard allows a uniform communication between subsystem simulators, but does not state how the inputs and outputs should be interpreted, nor how the subsystems should interact correctly. Semantic adaptations can be quickly made to correct the interactions with sub-system simulators that were produced with different assumptions, and avoid changing those sub-systems, their simulators, or the orchestration algorithm that computes the co-simulation. In this work, we explore how to describe common adaptations and what their meaning is in the context of FMI co-simulation. The result is a sound language that enables the implementation of adaptations with minimal effort. A distinct feature is that it describes adaptations for groups of interconnected subsystem simulators in the same way as for a single simulator, and the implementation is itself a simulator, thanks to a sound definition of hierarchical co-simulation. This work paves the way for research into the correct combination and interfacing of different adaptations.

Gomes2018: |
  Modeling and simulation techniques are today extensively used both in industry and science. Parts of larger systems are, however, typically modeled and simulated by different techniques, tools, and algorithms. In addition, experts from different disciplines use various modeling and simulation techniques. Both these facts make it difficult to study coupled heterogeneous systems. Co-simulation is an emerging enabling technique, where global simulation of a coupled system can be achieved by composing the simulations of its parts. Due to its potential and interdisciplinary nature, co-simulation is being studied in different disciplines but with limited sharing of findings. In this survey, we study and survey the state-of-the-art techniques for co-simulation, with the goal of enhancing future research and highlighting the main challenges. To study this broad topic, we start by focusing on discrete-event-based co-simulation, followed by continuous-time-based co-simulation. Finally, we explore the interactions be these two paradigms, in hybrid co-simulation. To survey the current techniques, tools, and research challenges, we systematically classify recently published research literature on co-simulation, and summarize it into a taxonomy. As a result, we identify the need for finding generic approaches for modular, stable, and accurate, coupling of simulation units, as well as expressing the adaptations required to ensure that the coupling is correct.

Gomes2018b: |
  In the engineering of heterogeneous systems, there have always been challenges related to ensuring a common understanding of the interfaces between the constituent systems. In these systems, the systematic analysis of the relevant artefacts is governed by different kinds of models based on different kinds of formalisms (e.g., state machine models for software-based controllers, and differential equations for physical sub-systems). In such a hybrid setting, it makes sense to examine how to combine different kinds of models in ways that enable a well-founded analysis of the interaction between these. Co-simulation has been proposed as a way forward by different stakeholders in different disciplines. It is a technique to couple multiple simulation tools, so that the interactions with, and within, a coupled system can be simulated through the cooperation of these tools. In this paper, we: provide an historical overview of the different facets of co-simulation; describe examples of industrial applications; identify the emerging trend and the challenges (both theoretical and practical) for the future use of this technology.

Gomes2018f: |
  Despite the large number of applications and growing interest in the challenges that co-simulation poses, the field is fragmented into multiple application domains, with limited sharing of knowledge. This demo promotes a deeper understanding of a well known stabilization feature in co-simulation, which is used in the INTO-CPS tool chain. We develop the techniques that explain the empirical results of instability of the double mass-spring-damper system, and how to the stabilization feature improves the results. Moreover, we show how the restrictions of the Functional Mock-up Interface Standard impacts stability.

Schweiger2018b: |
  Co-simulation is a promising approach for the analysis of complex, multi-domain systems, that leverages mature simulation tools of the respective domains. It has been applied in many different disciplines in academia and industry, with limited sharing of findings. With the increasing adoption of the FMI standard, researchers have set to work on surveying the scattered knowledge on co-simulation in academia. This paper complements the existing surveys by taking on the social and empirical aspect, corroborating, and prioritizing, previous findings. We focus on understanding the perceived research challenges, and the current barriers, based on expert assessment. One of the main barriers pointed out is the limited support for discrete event and hybrid co-simulation.

Schweiger2018: |
  Simulation-driven assessments and developments are regarded as key methods in designing and operating urban energy systems. Co-simulation enables the flexible coupling of established tools for the respective subsystems such as buildings, district heating and cooling systems or power distribution systems. The authors present an overview of the general concept behind co-simulation, promising standards, tools and discuss new possibilities for simulation of urban energy systems.

Thule2018: |
  Engineering modern, hybrid systems is becoming increasingly difficult due to the heterogeneity between different subsystems. Modelling and simulation techniques have traditionally been used to tackle complexity, but with increasing heterogeneity of the subsystems, it becomes impossible to find appropriate modelling languages and tools to specify and analyse the system as a whole. Co-simulation is a technique to combine multiple models and their simulators in order to analyse the behaviour of the whole system over time. Past research, however, has shown that the naïve combination of simulators can easily lead to incorrect simulation results, especially when co-simulating hybrid systems. This paper shows (i) how co-simulation of a family of hybrid systems can fail to reproduce the order of events that should have occurred (event ordering); (ii) how to prove that a co-simulation algorithm is correct (w.r.t. event ordering), and if it is incorrect, how to obtain a counterexample showing how the co-simulation fails; and (iii) how to correct an incorrect co-simulation algorithm. We apply the above method to two well known co-simulation algorithms used with the FMI Standard, and we show that one of them is incorrect for the family of hybrid systems under study, under the restrictions of the standard. The conclusion is that either the standard needs to be revised, or one of the algorithms should be avoided.

VanMierlo2017: |
  Any sufficiently complex system is best described (or specified) with a combination of models in multiple formalisms. To support the creation of such “hybrid models”, recent research focuses on the (syntactic and semantic) combination of formalism fragments. To implement the hybrid language’s operational semantics, the simulators of each of the formalisms are combined. Inspired by this same principle, we study how hybrid simulators can be instrumented with debugging capabilities. Previous work has shown that an explicit model of any simulator’s behaviour can be instrumented with common code debugging operations (e.g., stepwise execution, breakpoints, pause/play) and simulation-specific operations (such as (scaled) real-time simulation, or event injection). We extend this work by combining two debugging-enhanced simulators to create a hybrid simulator in a modular way, and instrument it with debugging support at the hybrid level. To demonstrate feasibility, we create a debugging-enhanced simulator of the Hybrid Automata formalism, by embedding a Causal Block Diagrams simulator in a Timed Finite State Automata simulator.

Gomes2017a: |
  For a wide variety of problems, creating detailed continuous models of physical systems is impractical. Hybrid models can abstract away short transient behaviour in order to simplify the study of such systems. For example, when modelling a bouncing ball, the bounce can be abstracted as a discontinuous change of the velocity. Impulsive differential equations can be used to model and simulate hybrid systems such as the bouncing ball. In this approach, the force acted on the ball by the floor is abstracted as an impulse. Current simulators cannot handle such approximations well due to the limitations of machine precision. In this paper, we present two approaches for the simulation of impulses: symbolic and numerical. Our contribution is a theoretically founded description of both approaches in a Causal Block Diagram simulator, and an analysis of the conditions for which a symbolic approach is better than a numerical one.

Gomes2017b: |
  For a wide variety of problems, creating detailed continuous models of (continuous) physical systems is, at the very least, impractical. Hybrid models can abstract away short transient behaviour (thus introducing discontinuities) in order to simplify the study of such systems. For example, when modelling a bouncing ball, the bounce can be abstracted as a discontinuous change of the velocity, instead of resorting to the physics of the ball (de-)compression to keep the velocity signal continuous. Impulsive differential equations can be used to model and simulate hybrid systems such as the bouncing ball. In this approach, the force acted on the ball by the floor is abstracted as an infinitely large function in an infinitely small interval of time, that is, an impulse. Current simulators cannot handle such approximations well due to the limitations of machine precision. In this paper, we explore the simulation of impulsive differential equations, where impulses are first class citizens. We present two approaches for the simulation of impulses: symbolic and numerical. Our contribution is a theoretically founded description of the implementation of both approaches in a Causal Block Diagram modelling and simulation tool. Furthermore, we investigate the conditions for which one approach is better than the other.

Gomes2017: |
  It is essential to find new ways of enabling experts in different disciplines to collaborate more efficient in the development of ever more complex systems, under increasing market pressures. One possible solution for this challenge is to use a heterogeneous model-based approach where different teams can produce their conventional models and carry out their usual mono-disciplinary analysis, but in addition, the different models can be coupled for simulation (co-simulation), allowing the study of the global behavior of the system. Due to its potential, co-simulation is being studied in many different disciplines but with limited sharing of findings. Our aim with this work is to summarize, bridge, and enhance future research in this multidisciplinary area. We provide an overview of co-simulation approaches, research challenges, and research opportunities, together with a detailed taxonomy with different aspects of the state of the art of co-simulation and classification for the past five years. The main research needs identified are: finding generic approaches for modular, stable and accurate coupling of simulation units; and expressing the adaptations required to ensure that the coupling is correct.

Gomes2017d: |
  Co-simulation promotes the idea that domain specific simulation tools should cooperate in order to simulate the inter-domain interactions that are often observed in complex systems. To get trustworthy results, it is important that this technique preserves the stability properties of the original system. In this paper, we show how to preserve stability for adaptive co-simulation schemes, which offer fine grained control over the performance/accuracy of the co-simulation. To this end, we apply the joint spectral radius theory to certify that an adaptive co-simulation scheme is stable, and, if that is not possible, we use recent results in this field to create a trace of decisions that lead to instability. With this trace, it is possible to adjust the adaptive co-simulation in order to make it stable. Our approach is limited by the fact that computing the joint spectral radius is NP-Hard and undecidable in general. In practice, we successfully applied our results to the co-simulation of a double mass-spring-damper system.

Gomes2017c: |
  Co-simulation is a technique to orchestrate multiple simulators in order to approximate the behavior of a coupled system as a whole. Simulators execute in a lockstep fashion, each exchanging inputs and output data points with the other simulators at pre-accorded times. In the context of systems with a physical and a cyber part, the communication frequency with which the simulators of each part communicate can have a negative impact in the accuracy of the global simulation results. In fact, the computed behavior can be qualitatively different, compared to the actual behavior of the original system, laying waste to potentially many hours of computation. It is therefore important to develop methods that answer whether a given communication frequency guarantees trustworthy co-simulation results. In this paper, we take a small step in that direction. We develop a technique to approximate the lowest frequency for which a particular set of simulation tools can exchange values in a co-simulation and obtain results that can be trusted.

Mustafiz2016a: |
  The engineering of a complex cyber-physical system (CPS) involves the creation and simulation of hybrid models often encompassing multiple levels of abstraction and combining different formalisms, often not expressible in any single existing formalisms. Modular language engineering is thus essential for effective and efficient development of new formalisms, appropriate for the task. In our work, each modeling language is represented as a language specification fragment: a modular representation of the syntax and semantics. We propose a white-box technique for explicitly modeling the definition and composition of the fragments. In this paper, we focus on the composition of the operational semantics (i.e., the semantic adaptation) of hybrid languages. This enables automatic synthesis of a simulator for the hybrid language. Our approach is demonstrated by creating two well-known hybrid languages as a composition of Timed Finite State Automata (TFSA) and Causal Block Diagrams (CBD) – hybrid TFSA and hybrid CBD.

Mustafiz2016: |
  Cyber-physical systems can be best represented using hybrid models that contain specifications of both continuous and discrete event abstractions. The syntax and semantics of such hybrid languages should ideally be defined by reusing the syntax and semantics of each components’ formalisms. In language composition, semantic adaptation is needed to ensure correct realization of the concepts that are part of the intricacies of the hybrid language. In this paper, we present a technique for the composition of heterogeneous languages by explicitly modelling the semantic adaptation between them. Each modelling language is represented as a language specification fragment (LSF): a modular representation of the syntax and semantics. The basis of our technique is to reuse the operational semantics as defined in existing simulators. Our approach is demonstrated by means of a hybrid language composed of timed finite state machines (TFSA) and causal block diagrams (CBD).

Lawrence2016: |
  Modelling cyber-physical systems is often seen as a highly multi-disciplinary activity. Therefore, efficient methodologies are required to be able to represent environment, plant and control models using the most appropriate formalisms. On the one hand, the Petri net formalism is appropriate to model the environment of a complex cyber-physical system, especially since it inherently supports non-determinism and concurrency. On the other hand, plant models, based on the laws of physics, are often represented using differential equations. In order to produce a relevant simulation of the overall system, the controller, the plant and the environment models are composed. Co-simulation and its industrial standard, the Functional Mock-up Interface, is one such generic technique that allows for the coupling of different executable models. However, coupling a non-deterministic model with other types of models would be equivalent to build the state space of the given composed system, which in some cases is too complex. In this paper we discuss the co-simulation of a Petri net environment model with a system described by causal block diagrams. To reduce the size of the state space explored, we use a constraint language based on automata and trace matching. The approach is applied to the simulation of a simplified train system.

Gomes2016a: |
  The description of a complex system in terms of constituent components and their interaction is one of the most natural and intuitive ways of decomposition. Causal Block Diagram (CBD) models combine subsystem blocks in a network of relationships between input signals and output signals. Popular modeling and simulation tools such as Matlab/Simulink® implement different variants from the family of Causal Block Diagram formalisms. This chapter gives an overview of modeling and simulation of systems with software and physical components using Causal Block Diagrams. It describes the syntax and - both declarative and operational - semantics of CBDs incrementally. Starting from simple algebraic models (no notion of time), we introduce, first a discrete notion of time (leading to discrete-time CBDs) and subsequently, a continuous notion of time (leading to continuous-time CBDs). Each new variant builds on the previous ones. Because of the heavy dependency of CBDs on numerical techniques, we give an intuitive introduction to this important field, pointing out main solutions as well as pitfalls. After reading this chapter, the reader will be able to judge when to use the CBD formalism and how to use it, as well as the main issues often encountered with the description of physical systems and the implementation of CBD simulators.

Gomes2016: |
  Complex systems have to decomposed into sub-systems which are developed by specialized teams. Modeling and simulation techniques help each team achieve a locally optimal solution but they fail to help all teams achieve a globally optimal solution. This is due to each team having its own models made in its own tools, and external suppliers having intellectual property. The result is that it is difficult to simulate the coupled system. Co-simulation is proposed as a way to enable such simulation. Simulators communicate and collaborate as black boxes. The technique has been used in a number of domains improving the overall cost of engineered systems. In these use cases, a minimum common denominator is assumed for the capabilities of simulators. Leveraging the optional capabilities of simulators improves the performance/accuracy of a co-simulation, but the number of decisions the orchestration mechanism has to make grows exponentially. Different, conflicting concerns have to be addressed in an optimal way. We propose a way to deal with each concern independently and possibly reuse existing orchestration algorithms that perform better with respect to the conflicting concerns. Our approach leverages Model Driven Development techniques to process a co-simulation scenario into a canonical/trivial version, where fewer decisions remain to be made. Along the process, conflicting concerns will be addressed as an optimization problem, and an appropriate cost function identified. If successful, the result of this research allows co-simulation scenarios that may offer real-time guarantees, bounds in the maximum error made, or packet size in the communication between simulators.

Lucio2015: |
  We introduce SyVOLT, a plugin for the Eclipse development environment for the verification of structural pre/post-condition contracts on model transformations. The plugin allows the user to build transformations in our transformation language DSLTrans using a visual editor. The pre-/post-condition contracts to be proved on the transformation can also be built in a similar interface. Our contract proving process is exhaustive, meaning that if a contract is said to hold, then the contract will hold for all input models of a transformation. If the contract does not hold, then the counter-examples (i.e., input models) where the contract fails will be presented. Demo: https://www.youtube.com/watch?v=8PrR5RhPptY

Gomes2014: |
  While comparing different model transformation languages (MTLs), it is common to refer to their syntactic and semantic features and overlook their supporting tools’ performance. Performance is one of the aspects that can hamper the application of MDD to industrial scenarios. An highly declarative MTL might simply not scale well when using large models due to its supporting implementation. In this paper, we focus on the several pattern matching techniques (including optimization techniques) employed in the most popular transformation tools, and discuss their effectiveness w.r.t. the expressive power of the languages used. Because pattern matching is the most costly operation in a transformation execution, we present a classification of the existing model transformation tools according to the pattern matching optimization techniques they implement. Our classification complements existing ones that are more focused at syntactic and semantic features of the languages supported by those tools.

Gomes2014a: |
  The reported productivity gains while using models and model transformations to develop entire systems, after almost a decade of experience applying model-driven approaches for system development, are already undeniable benefits of this approach. However, the slowness of higher-level, rule based model transformation languages hinders the applicability of this approach to industrial scales. Lower-level, and efficient, languages can be used but productivity and easy maintenance seize to exist. The abstraction penalty problem is not new, it also exists for high-level, object oriented languages but everyone is using them now. Why is not everyone using rule based model transformation languages then? In this thesis, we propose a framework, comprised of a language and its respective environment, designed to tackle the most performance critical operation of high-level model transformation languages: the pattern matching. This framework shows that it is possible to mitigate the performance penalty while still using high-level model transformation languages.
